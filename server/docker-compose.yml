services:
  app:
    build:
      context: ..
      dockerfile: server/Dockerfile
    restart: unless-stopped
    volumes:
      - ./data:/app/data
    env_file: .env
    expose:
      - "8080"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
